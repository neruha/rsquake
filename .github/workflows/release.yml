name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    # タグと Cargo.toml の version が食い違ったまま配らない
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

  windows:
    needs: [verify]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        shell: pwsh
        # v7 以降は OSMF EULA への同意が必要なので v5 に固定
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.msi

  macos:
    needs: [verify]
    if: ${{ !failure() && !cancelled() }}
    # arch ごとに、その arch のランナーでビルドする (クロスビルドしない)
    #   RSQuake-<version>-macos-arm64.dmg / RSQuake-<version>-macos-x86_64.dmg
    # 配布物の名前は、アプリ内の更新が探す名前 (src/update/asset.rs) なので変えない
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            package_arch: arm64
            runner: macos-latest
          - arch: x86_64
            package_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - name: Package (${{ matrix.arch }})
        run: bash ./scripts/package-macos.sh ${{ matrix.package_arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    needs: [verify]
    if: ${{ !failure() && !cancelled() }}
    # arch ごとに、その arch のランナーでビルドする (クロスビルドしない)
    #   RSQuake-<version>-linux-x86_64.tar.gz / RSQuake-<version>-linux-aarch64.tar.gz
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
      - name: Package (${{ matrix.arch }})
        run: bash ./scripts/package-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # アプリ内の更新は、この署名を埋め込んだ公開鍵 (src/update/verify.rs) で確かめてから入れ替える。
      # 秘密鍵は secret MINISIGN_SECRET_KEY (鍵ファイルの中身)。パスワード無しで作った鍵を使う。
      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::secret MINISIGN_SECRET_KEY がありません"
            exit 1
          fi
          curl -fsSL -o minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          tar xzf minisign.tar.gz
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${RUNNER_TEMP}/minisign.key"
          ./minisign-linux/x86_64/minisign -S -s "${RUNNER_TEMP}/minisign.key" -m artifacts/SHA256SUMS -x artifacts/SHA256SUMS.minisig -c "RSQuake ${GITHUB_REF_NAME}" < /dev/null
          rm -f "${RUNNER_TEMP}/minisign.key"
          ./minisign-linux/x86_64/minisign -V -P "RWRBln5NwYcW1hoogap/HJk+sLfxlI4AosFEC0u69cf+42jXpLzstaIO" -m artifacts/SHA256SUMS -x artifacts/SHA256SUMS.minisig
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # 下書きで作る。内容を確認してから GitHub 上で公開する
          draft: true
          # v0.3.0-pre.1 のように - を含むタグはプレリリース
          prerelease: ${{ contains(github.ref_name, '-') }}
          # リリースノートは、前のタグからのコミットとマージした PR から自動で作る
          generate_release_notes: true
